<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="scriptMeteroids.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>Meteroids</title>
  </head>
  <header id="header"></header>
  <body>
    <canvas id="canvas"></canvas>
    <div id="infoContainer">
      <div class="controls">
        <div class="control">
          <button>◀</button>
          <p>Move Left</p>
        </div>
        <div class="control" id="fireControl">
          <button>&#x1F53C</button>
          <p>Fire</p>
        </div>

        <div class="control">
          <button>▶</button>
          <p>Move Right</p>
        </div>
      </div>
    </div>

    <br /><button id="startGameBtn" onclick="StartGame()">Start Game</button>
  </body>
</html>
